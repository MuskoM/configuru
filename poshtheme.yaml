# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
final_space: true
version: 3
blocks:
  - type: prompt
    alignment: left
    segments:
      - type: os
        style: diamond
        trailing_diamond: ""
        leading_diamond: ""
        template: "{{.Icon}}"
        foreground: "#232634"
        background: "#ca9ee6"

      - type: battery
        style: diamond
        trailing_diamond: ""
        foreground: "#232634"
        background: "#81c8be"
        background_templates:
          - '{{if eq "Charging" .State.String}}#a6d189{{end}}'
          - '{{if eq "Discharging" .State.String}}#e78284{{end}}'
          - '{{if eq "Full" .State.String}}#81c8be{{end}}'
        template: " {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }} "
        properties:
          discharging_icon: " "
          charging_icon: " "
          charged_icon: " "

      - type: git
        style: diamond
        trailing_diamond: ""
        foreground: "#232634"
        background: "#8caaee"
 
      - type: project
        style: powerline
        powerline_symbol: ""
        foreground: "#232634"
        background: "#81c8be"

      # Languages
      - type: lua
        style: powerline
        powerline_symbol: ""
      - type: node
        style: powerline
        powerline_symbol: ""
      - type: python
        style: powerline
        powerline_symbol: ""
      - type: rust
        style: powerline
        powerline_symbol: ""

      - type: path
        style: diamond
        trailing_diamond: ""
        foreground: "#232634"
        background: "#babbf1"
        properties:
          style: folder
          home_icon: 
          folder_icon: 󰉋
          mapped_locations_enabled: true
          mapped_locations: 
            ~/configurations : 󰙵
      ### 
