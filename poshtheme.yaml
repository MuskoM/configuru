# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
final_space: true
version: 3
blocks:
  - type: prompt
    alignment: left
    segments:
      - type: os
        style: diamond
        trailing_diamond: ""
        leading_diamond: ""
        template: "{{.Icon}}"
        foreground: "#232634"
        background: "#be8edc"

      - type: battery
        style: diamond
        trailing_diamond: ""
        foreground: "#232634"
        background: "#f1b065"
        background_templates:
          - '{{if eq "Charging" .State.String}}#c5e57b{{end}}'
          - '{{if eq "Discharging" .State.String}}#e78284{{end}}'
          - '{{if eq "Full" .State.String}}#f1b065{{end}}'
        template: " {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }} "
        properties:
          discharging_icon: " "
          charging_icon: " "
          charged_icon: " "

      - type: git
        style: diamond
        trailing_diamond: ""
        foreground: "#232634"
        background: "#8caaee"
 
      - type: project
        style: powerline
        powerline_symbol: ""
        foreground: "#232634"
        background: "#f1b065"

      # Languages
      - type: lua
        style: powerline
        powerline_symbol: ""
      - type: node
        style: powerline
        powerline_symbol: ""
      - type: python
        style: powerline
        powerline_symbol: ""
      - type: rust
        style: powerline
        powerline_symbol: ""

      - type: path
        style: diamond
        trailing_diamond: ""
        foreground: "#232634"
        background: "#e199cc"
        properties:
          style: folder
          home_icon: 
          folder_icon: 󰉋
          mapped_locations_enabled: true
          mapped_locations: 
            ~/configurations : 󰙵
      ### 
