[window]
opacity=0.30
blur = true
padding = { x = 8, y = 8}

[font]
normal = { family = "ZedMono NF", style = "Regular" } 
bold = { family = "ZedMono NF" }
italic = { family = "ZedMono NF" }
bold_italic = { family = "ZedMono NF"}
size = 14

[cursor]
style = { blinking = "On" }
blink_interval = 1000
blink_timeout = 10

[mouse]
hide_when_typing = false
